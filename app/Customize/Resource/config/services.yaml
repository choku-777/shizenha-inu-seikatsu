services:
    # 商品登録価格を税込価格として扱うためのサービス上書き
    # EC-CUBE標準のサービス定義をカスタマイズクラスに差し替える（lazy/public は維持）
    Eccube\Service\TaxRuleService:
        class: Customize\Service\TaxRuleServiceExtension
        autowire: true
        lazy: true
        public: true

    Eccube\Service\OrderHelper:
        class: Customize\Service\OrderHelperExtension
        autowire: true
        public: true

    # 商品画像のWebP自動変換
    Customize\EventListener\ProductImageWebpListener:
        arguments:
            $projectDir: '%kernel.project_dir%'
            $logger: '@logger'
        tags:
            - { name: doctrine.event_listener, event: postPersist }
